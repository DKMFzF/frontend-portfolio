# deploy app

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-cli
    # Настраиваем ключ
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_SERVER" >> ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_SERVER "
        echo '$NEXUS_PASSWORD' | docker login -u '$NEXUS_USER' --password-stdin $NEXUS_REGISTRY &&
        docker pull $NEXUS_REGISTRY/$NEXUS_REPO:$CI_COMMIT_SHORT_SHA &&
        docker stop myapp || true &&
        docker rm myapp || true &&
        docker run -d --name myapp -p 8081:8081 $NEXUS_REGISTRY/$NEXUS_REPO:$CI_COMMIT_SHORT_SHA
      "
