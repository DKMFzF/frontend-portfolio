# build release and push docker images in Nexus

variables:
  NEXUS_REGISTRY: "${NEXUS_REGISTRY}"
  NEXUS_REPO: "${NEXUS_REPO}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

docker-release:
  stage: docker-release
  image: docker:24.0.2
  tags: [nodejs-docker]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
  before_script:
    - echo "${NEXUS_PASSWORD}" | docker login -u "${NEXUS_USER}" --password-stdin $NEXUS_REGISTRY
  script:
    - docker info       # проверка доступа к Docker daemon
    - docker build -t $NEXUS_REGISTRY/$NEXUS_REPO:$CI_COMMIT_SHORT_SHA -f ./docker/Dockerfile .
    - docker push $NEXUS_REGISTRY/$NEXUS_REPO:$CI_COMMIT_SHORT_SHA
