name: Lint and Test

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

  workflow_dispatch:

jobs:
  install-deps:
    name: Install Dependencies & Cache
    runs-on: ubuntu-latest
    container: node:20
    outputs:
      cache-hit: ${{ steps.cache-node-modules.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Node.js modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node- 

      - name: Start download dependencies
        run: npm i --legacy-peer-deps

      - name: Upload node_modules as artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-modules-cache
          path: node_modules

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    needs: install-deps
    container: node:20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node-modules-cache
          path: .

      - name: Run linter
        run: npm run lint

  test:
    name: Test Code
    runs-on: ubuntu-latest
    needs: install-deps
    container: node:20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules artifact
        uses: actions/download-artifact@v4
        with:
          name: node-modules-cache
          path: .

      - name: Run Tests
        run: npm run test
